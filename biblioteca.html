<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faraway Worlds - Biblioteca</title>
  <style>
    body {font-family: 'Georgia', serif;
      background-color: #E3DAC9; /* Fondo color papel cálido */
      color: #2b2b2b;
      max-width: 650px;
      margin: 0 auto;
      padding: 20px 15px;}
    h1 {text-align: center;
      color: #1a1a1a;
      margin-bottom: 10px;}
    .subtitulo {text-align: center;
      color: #7a6e5d;
      font-size: 0.9rem;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;}
    .tarjeta-indice {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 16px 20px;
      margin-bottom: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: bold;
      color: #2c2c2c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s ease, transform 0.1s ease;}
    .tarjeta-indice:active {background: rgba(255, 255, 255, 0.85);
      transform: scale(0.98);}
    .flecha-icono {
      color: #8a7b66;
      font-size: 1.2rem;}
    #vista-capitulo {display: none;}
    .header-libro {text-align: center;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #7a6e5d;
      margin-bottom: 5px;}

    h2 {text-align: center;
      color: #1a1a1a;
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 20px;}
    .navegacion-capitulo {display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 25px 0;
      padding: 12px 0;
      border-top: 1px solid rgba(0, 0, 0, 0.12);
      border-bottom: 1px solid rgba(0, 0, 0, 0.12);}
    .boton-nav {background-color: #d8cebc;
      color: #2c2c2c;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;}
    .boton-nav:active {background-color: #c4b49d;}
    .texto-historia {white-space: pre-wrap;
      font-size: 18px;
      line-height: 1.6;}
  .sticker {height: 1.2em;
      width: auto;
    vertical-align: middle;
    display: inline-block;
    margin: 0 2px;}
  </style>
</head>
<body>
  <div id="vista-indice">
    <h1>Faraway Worlds</h1>
    <div class="subtitulo">Índice de Capítulos</div>
    <div id="lista-capitulos"></div>
  </div>
  <div id="vista-capitulo">
    <div class="header-libro">Faraway Worlds</div>
    <h2 id="titulo-capitulo"></h2>
    <div class="navegacion-capitulo">
      <button class="boton-nav" onclick="irAlIndice()">Índice</button>
      <button class="boton-nav btn-anterior" onclick="cambiarCapitulo(-1)">← Anterior</button>
      <button class="boton-nav btn-siguiente" onclick="cambiarCapitulo(1)">Siguiente →</button>
    </div>
    <div class="texto-historia" id="texto-capitulo"></div>
    <div class="navegacion-capitulo">
      <button class="boton-nav" onclick="irAlIndice()">Índice</button>
      <button class="boton-nav btn-anterior" onclick="cambiarCapitulo(-1)">← Anterior</button>
      <button class="boton-nav btn-siguiente" onclick="cambiarCapitulo(1)">Siguiente →</button>
    </div>
  </div>
  <script>
    let capitulos = JSON.parse(localStorage.getItem("mis_capitulos")) || [];
    let capituloActualIndex = 0;
    function cargarIndice() {let lista = document.getElementById("lista-capitulos");
      lista.innerHTML = "";
      if (capitulos.length === 0) {lista.innerHTML = "<p style='text-align:center;'>Aún no has publicado capítulos desde tu panel.</p>";
        return;}
      capitulos.forEach((cap, index) => {let tarjeta = document.createElement("div");
        tarjeta.className = "tarjeta-indice";
        tarjeta.innerHTML = `<span>${cap.titulo}</span> <span class="flecha-icono">➔</span>`;
        tarjeta.onclick = () => abrirCapitulo(index);
        lista.appendChild(tarjeta);});}
    function abrirCapitulo(index) {
      capituloActualIndex = index;
      let cap = capitulos[index];
      document.getElementById("titulo-capitulo").innerText = cap.titulo;
      document.getElementById("texto-capitulo").innerHTML = cap.texto.replace(/\n/g, '<br>');
      document.getElementById("vista-indice").style.display = "none";
      document.getElementById("vista-capitulo").style.display = "block";
      let hayAnterior = index > 0;
      let haySiguiente = index < capitulos.length - 1;
      document.querySelectorAll(".btn-anterior").forEach(btn => {btn.style.visibility = hayAnterior ? "visible" : "hidden";});
      document.querySelectorAll(".btn-siguiente").forEach(btn => {
        btn.style.visibility = haySiguiente ? "visible" : "hidden";});
      window.scrollTo(0, 0); }
    function irAlIndice() {document.getElementById("vista-capitulo").style.display = "none";
      document.getElementById("vista-indice").style.display = "block";
      window.scrollTo(0, 0);}
    function cambiarCapitulo(direccion) {
      let nuevoIndex = capituloActualIndex + direccion;
      if (nuevoIndex >= 0 && nuevoIndex < capitulos.length) {
        abrirCapitulo(nuevoIndex);}}
    cargarIndice();
  </script>
  <footer>
    <button style="padding: 10px 18px; background: #8a2be2; color: white; border: none; border-radius: 8px; cursor: pointer;" onclick="window.location.href='index.html'">volver a la pagina principal <img src="sticker1.png" class="sticker"></button>
  </footer>
</body>
</html>
